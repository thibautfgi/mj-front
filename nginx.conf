server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirection pour Angular Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend moteur
    location /api/ {
        proxy_pass http://mj-moteur:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy vers le backend auth
    location /auth/ {
        proxy_pass http://mj-auth:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
