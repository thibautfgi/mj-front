<div class="maps-buttons-content" (click)="$event.stopPropagation()">

  <app-custom-buttons-rond
    [icon]="faLayerGroup"
    [customColor]="isSatellite ? '#1a6b8a' : undefined"
    ariaLabel="Changer le style de carte"
    [tooltip]="isSatellite ? 'Vue terrain' : 'Vue satellite'"
    (click)="toggleStyle()">
  </app-custom-buttons-rond>

  <app-custom-buttons-rond
    [icon]="faSnowflake"
    [customColor]="snowVisible ? '#1a6b8a' : undefined"
    ariaLabel="Afficher / masquer la neige"
    [tooltip]="snowVisible ? 'Masquer la neige' : 'Activer la vue neige'"
    (click)="toggleSnow()">
  </app-custom-buttons-rond>

  <app-custom-buttons-rond
    [icon]="faMoon"
    ariaLabel="Mode nuit"
    tooltip="Mode nuit">
  </app-custom-buttons-rond>

  <!-- bouton GPX — label natif garanti par le navigateur -->
  <div class="btn-wrapper">
    <label class="btn gpx-btn" aria-label="Importer un fichier GPX">
      <fa-icon [icon]="faFileImport"></fa-icon>
      <input
        type="file"
        accept=".gpx"
        (change)="onGpxSelected($event)"
        (click)="$event.stopPropagation()">
    </label>
    <span class="btn-tooltip">Importer un GPX</span>
  </div>

</div>
