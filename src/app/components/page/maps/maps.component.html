<div class="maps-wrapper">

  <div class="maps-tabs-container">
    <app-maps-tabs></app-maps-tabs>
  </div>

  <div class="maps-buttons-container">
    <app-maps-buttons
      (toggleSnowEvent)="onToggleSnow($event)"
      (toggleStyleEvent)="onToggleStyle($event)"
      (gpxFileEvent)="onGpxFile($event)">
    </app-maps-buttons>
  </div>

  <div class="map-container">
    <div #mapContainer class="map-inner"></div>
  </div>

</div>
