<div class="login-page">
  <div class="login-card">
    <h2>{{ mode() === 'login' ? 'Prêt à l\'exploration ?' : 'Créer un compte' }}</h2>
    <p class="subtitle">
      {{ mode() === 'login'
      ? 'Connectez-vous à votre compte'
      : 'Inscrivez-vous pour commencer l\'aventure' }}
    </p>

    <!-- Switch Connexion / Inscription -->
    <div class="mode-switch">
      <button
        [class.active]="mode() === 'login'"
        (click)="switchMode('login')">
        Connexion
      </button>
      <button
        [class.active]="mode() === 'signup'"
        (click)="switchMode('signup')">
        Inscription
      </button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input type="email"
               formControlName="email"
               placeholder="Adresse e-mail"
               class="input-field">
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'"
                 formControlName="password"
                 placeholder="Mot de passe"
                 class="input-field">
          <span class="toggle-icon" (click)="togglePassword()">
            {{ showPassword() ? '●' : '👁' }}
          </span>
        </div>
      </div>

      <button type="submit"
              class="btn-primary"
              [class.btn-disabled]="passwordTooShort"
              [disabled]="loginForm.invalid || isLoading() || passwordTooShort">
        {{ isLoading() ? 'Chargement...' : (mode() === 'login' ? 'Se connecter' : 'Créer mon compte') }}
      </button>
    </form>

    <p class="legal-text">
      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }
    </p>
  </div>
</div>
