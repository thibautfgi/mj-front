<div class="modal-overlay" (click)="closeModal.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Créer un compte</h3>
      <button type="button" class="close-btn" (click)="closeModal.emit()">✕</button>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input type="text" formControlName="firstName" placeholder="Prénom" class="input-field" required>
      </div>
      <div class="input-group">
        <input type="text" formControlName="lastName" placeholder="Nom" class="input-field" required>
      </div>
      <div class="input-group">
        <input type="email" formControlName="email" placeholder="Adresse e-mail" class="input-field" required>
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'"
                 formControlName="password"
                 placeholder="Mot de passe"
                 class="input-field">
          <span class="toggle-icon" (click)="togglePassword()">
            {{ showPassword() ? '🙈' : '👁️' }}
          </span>
        </div>
      </div>

      <div class="input-group">
        <div class="password-wrapper">
          <input [type]="showConfirmPassword() ? 'text' : 'password'"
                 formControlName="confirmPassword"
                 placeholder="Confirmer le mot de passe"
                 class="input-field">
          <span class="toggle-icon" (click)="toggleConfirmPassword()">
            {{ showConfirmPassword() ? '🙈' : '👁️' }}
          </span>
        </div>
      </div>

      <div class="input-group">
        <input type="tel" formControlName="phone" placeholder="Numéro de téléphone (optionnel)" class="input-field">
      </div>

      <button type="submit" class="btn-primary" [disabled]="signupForm.invalid || isLoading()">
        {{ isLoading() ? 'Création en cours...' : 'Créer mon compte' }}
      </button>
    </form>
  </div>
</div>
