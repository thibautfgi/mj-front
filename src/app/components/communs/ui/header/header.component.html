<div class="container-header">

  <div class="container-button-left">
    <a routerLink="/home">
      <app-custom-buttons customColor="#3891a6" textButton="Explorer"></app-custom-buttons>
    </a>
    <app-custom-buttons customColor="#3891a6" textButton="Communauté"></app-custom-buttons>
  </div>

  <div class="container-button-center">
    <img alt="Mountain Journey Logo" class="logo" height="100" ngSrc="/assets/Images/logo-transp.png" width="100">
  </div>

  <div class="container-button-right">
    <a routerLink="/maps">
      <app-custom-buttons customColor="#3891a6" textButton="Mes cartes"></app-custom-buttons>
    </a>

    @if (authService.user(); as user) {
      <app-custom-buttons
        customColor="#3891a6"
        textButton="{{ user.userFirstName + ' >' }}"
        (click)="showUserMenu = !showUserMenu">
      </app-custom-buttons>

      @if (showUserMenu) {
        <div class="user-menu">
          <span class="user-menu-name">{{ user.userFirstName }} {{ user.userLastName }}</span>
          <span class="user-menu-email">{{ user.userEmail }}</span>
          <hr class="user-menu-divider">
          <button class="user-menu-item" (click)="onLogout()">
            Se déconnecter
          </button>
        </div>
      }
    } @else {
      <a routerLink="/login">
        <app-custom-buttons customColor="#3891a6" textButton="Se connecter"></app-custom-buttons>
      </a>
    }
  </div>

</div>
